<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2025 我司全球贸易全息投影 (全量双语版)</title>
  <style>
    /* --- 1. 基础环境 --- */
    body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: "Microsoft YaHei", sans-serif; }
    #globeViz { width: 100vw; height: 100vh; }
    
    /* --- 2. 顶部 UI --- */
    .ui-overlay { position: absolute; top: 30px; left: 30px; pointer-events: none; z-index: 10; }
    h1 {
      margin: 0; font-size: 42px; font-weight: 900; letter-spacing: 4px; font-style: italic;
      background: linear-gradient(135deg, #fff 0%, #ff3333 50%, #ffaa00 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.6));
    }
    .sub-text { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
    .deco-line { width: 40px; height: 3px; background: #ff3333; box-shadow: 0 0 8px #ff3333; }
    .sub-text span { font-family: 'Consolas'; color: #ffaaaa; font-size: 12px; letter-spacing: 2px; }

    /* --- 3. 图例 --- */
    .legend {
      position: absolute; bottom: 30px; left: 30px; 
      background: rgba(20, 0, 0, 0.85); padding: 20px; 
      border-left: 4px solid #ff3333; border-radius: 0 8px 8px 0; color: #fff; pointer-events: none;
    }
    .color-bar {
      width: 240px; height: 8px; margin: 12px 0; border-radius: 4px;
      background: linear-gradient(90deg, #0a1a2a, #00aaff, #ffcc00, #ff0000);
    }
    .legend-labels { display: flex; justify-content: space-between; color: #aa8888; font-size: 11px; }

    /* --- 4. 提示框 (保持无边框修复) --- */
    .scene-tooltip {
      background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important;
      pointer-events: none; 
    }
    .cyber-tooltip-card {
      background: rgba(10, 0, 0, 0.95);
      border: 1px solid rgba(255, 50, 50, 0.5);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      border-radius: 4px; padding: 15px 20px; color: #fff;
      transform: translate(20px, -20px); min-width: 220px; font-family: "Microsoft YaHei";
    }
    .tt-header { border-bottom: 1px dashed rgba(255, 255, 255, 0.3); padding-bottom: 8px; margin-bottom: 8px; }
    .tt-name { font-size: 18px; font-weight: bold; color: #fff; }
    .tt-val { font-size: 14px; color: #ffcc00; font-family: 'Consolas'; margin-top: 4px; }
    .tt-product-list li { font-size: 13px; color: #ffdddd; margin-bottom: 4px; padding-left: 12px; position: relative; list-style:none;}
    .tt-product-list li::before { content: '>'; position: absolute; left: 0; color: #ff3333; font-size: 10px; top: 2px; }
    /* 无业务时的样式 */
    .tt-no-data { color: #888; font-size: 13px; font-style: italic; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.30.0/dist/globe.gl.min.js"></script>
</head>
<body>

    </div>

      "TTO": "特立尼达和多巴哥", "USA": "美国", "VIR": "美属维尔京群岛",
      
      // 南美洲
      "ARG": "阿根廷", "BOL": "玻利维亚", "BES": "博奈尔岛、圣尤斯特歇斯岛和萨巴岛", "BRA": "巴西",
      "CHL": "智利", "COL": "哥伦比亚", "ECU": "厄瓜多尔", "FLK": "福克兰群岛", "GUY": "圭亚那",
      "PRY": "巴拉圭", "PER": "秘鲁", "SUR": "苏里南", "URY": "乌拉圭", "VEN": "委内瑞拉",
      
      // 大洋洲
      "ASM": "美属萨摩亚", "AUS": "澳大利亚", "COK": "库克群岛", "FJI": "斐济", "PYF": "法属波利尼西亚",
      "GUM": "关岛", "KIR": "基里巴斯", "MHL": "马绍尔群岛", "FSM": "密克罗尼西亚联邦", "NRU": "瑙鲁",
      "NCL": "新喀里多尼亚", "NZL": "新西兰", "NIU": "纽埃", "MNP": "北马里亚纳群岛", "PLW": "帕劳",
      "PNG": "巴布亚新几内亚", "WSM": "萨摩亚", "SLB": "所罗门群岛", "TKL": "托克劳",
      "TON": "汤加", "TUV": "图瓦卢", "VUT": "瓦努阿图", "WLF": "瓦利斯和富图纳群岛"
    };

    const chinaRegions = ['CHN', 'TWN', 'HKG', 'MAC'];

    function getUnifiedData(iso) {
      if (chinaRegions.includes(iso)) return tradeData['CHN'];
      return tradeData[iso];
    }

    function getTradeColor(iso) {
      if (chinaRegions.includes(iso)) return '#ff3333';
      const data = tradeData[iso];
      if (!data) return '#081520'; 
      if (data.val > 8) return '#ffd700';
      if (data.val > 5) return '#00ff99';
      if (data.val > 3) return '#00aaff';
      return '#1e6091';
    }



    window.onload = function() {
      const globeEl = document.getElementById('globeViz');
      const world = Globe()(globeEl)
        .backgroundColor('#000')
        .showAtmosphere(true)
        .atmosphereColor('#ff4444')
        .atmosphereAltitude(0.2)
        .globeImageUrl(null)
        .pointOfView({ lat: 25, lng: 110, altitude: 1.8 });

      const controls = world.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;

      let hoverIso = null;

      const updateScene = () => {
        world.polygonCapColor(world.polygonCapColor())
             .polygonAltitude(world.polygonAltitude());
      };

      fetch('https://cdn.jsdelivr.net/gh/vasturiano/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson')
        .then(res => res.json())
        .then(countries => {
          // 调试：检查法国的数据
          const franceData = countries.features.find(f => f.properties.ISO_A3 === 'FRA' || f.properties.NAME === 'France');
          console.log('法国地图数据:', franceData);
          
          world
            .polygonsData(countries.features.filter(d => d.properties.ISO_A2 !== 'AQ'))
            .polygonsTransitionDuration(300)

            // 高度联动 - 修复：只提升当前悬停国家或中国相关区域
            .polygonAltitude(d => {
              const iso = d.properties.ISO_A3;
              const data = getUnifiedData(iso);
              const isChinaPart = chinaRegions.includes(iso);
              const isHoveringChina = window.hoverPolygon && chinaRegions.includes(window.hoverPolygon.properties.ISO_A3);
              const shouldLift = (d === window.hoverPolygon) || (isChinaPart && isHoveringChina);

              let baseAlt = data ? Math.min(data.val * 0.03, 0.4) : 0.01;
              return shouldLift ? baseAlt + 0.1 : baseAlt;
            })

            // 颜色联动 - 修复：只高亮当前悬停国家或中国相关区域
            .polygonCapColor(d => {
              const iso = d.properties.ISO_A3;
              const isChinaPart = chinaRegions.includes(iso);
              const isHoveringChina = window.hoverPolygon && chinaRegions.includes(window.hoverPolygon.properties.ISO_A3);
              if (d === window.hoverPolygon || (isChinaPart && isHoveringChina)) return '#ffffff';
              return getTradeColor(iso);
            })

            .polygonSideColor(() => 'rgba(255, 255, 255, 0.1)')
            .polygonStrokeColor(() => '#333')
            
            // --- Tooltip 逻辑 (修改点：双语 + 全量显示) ---
            .polygonLabel(({ properties: d }) => {
              // 修复：从properties对象中正确获取ISO代码
              const iso = d.ISO_A3 || d.ISO_A2 || 'UNKNOWN';
              const data = getUnifiedData(iso);
              
              // 1. 获取双语名称 - 增强：确保法国等国家能正确显示中文名
              let cnName = countryNameMap[iso];
              // 针对法国等特定国家的保障措施
              if (!cnName) {
                // 直接通过国家名称匹配
                const countryName = d.NAME.toLowerCase();
                if (countryName.includes('france')) cnName = '法国';
                else if (countryName.includes('germany')) cnName = '德国';
                else if (countryName.includes('italy')) cnName = '意大利';
                else if (countryName.includes('spain')) cnName = '西班牙';
                else if (countryName.includes('uk') || countryName.includes('britain')) cnName = '英国';
                else if (countryName.includes('japan')) cnName = '日本';
                else if (countryName.includes('usa') || countryName.includes('united states')) cnName = '美国';
              }
              // 如果仍未找到，使用原名
              cnName = cnName || d.NAME;
              let enName = d.NAME;
              let displayName = `${cnName} <span style="font-size:12px; color:#888; font-weight:normal;">(${enName})</span>`;

              // 中国特殊处理
              if (chinaRegions.includes(iso)) {
                displayName = "中国 <span style='font-size:12px; color:#888; font-weight:normal;'>(China)</span>";
              }

              // 2. 构建内容 (有数据 vs 无数据)
              let contentHtml = '';
              let subText = '';

              if (data) {
                // 有业务数据
                const products = data.products.map(p => `<li>${p}</li>`).join('');
                contentHtml = `
                  <div class="tt-val">业务热度: ${data.val}</div>
                  <ul class="tt-product-list">${products}</ul>
                `;
                // 中国区域显示特殊备注 - 已移除小字说明
                if (chinaRegions.includes(iso)) {
                  subText = ''; // 清空小字说明
                }
              } else {
                // 无业务数据 (不再返回 null，而是显示无业务提示)
                contentHtml = `<div class="tt-no-data" style="margin-top:5px;">暂无业务拓展</div>`;
              }

              return `
                <div class="cyber-tooltip-card">
                  <div class="tt-header">
                    <div class="tt-name">${displayName}</div>
                  </div>
                  ${contentHtml}
                  ${subText}
                </div>
              `;
            })

            // 修复：使用多边形对象引用而非ISO代码来避免国家合并问题
            .onPolygonHover(hoverD => {
              window.hoverPolygon = hoverD; // 保存当前悬停的多边形对象
              controls.autoRotate = hoverD === null; 
              updateScene();
            })


        });
    };
  </script>
